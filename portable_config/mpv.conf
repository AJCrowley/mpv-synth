# slang=en
# Forces a drop shadow and border on subtitles, which can be useful for visibility on bright backgrounds. You can customize the colors and sizes below.
# =============================================================================
# SUBTITLE STYLE
# =============================================================================
# Override built in styles {bool}
sub-ass-override=force
# Subtitle font size {int(10-100)}
sub-font-size=40
# Subtitle colour {colourpicker}
sub-color="#ffdb00"
# Subtitle colour {colourpicker}
sub-border-color="#000000"
# Subtitle border size {int(1-10)}
sub-border-size=1
# Subtitle shadow offset {int(1-10)}
sub-shadow-offset=1
# Subtitle shadow colour {colourpicker}
sub-shadow-color="#000000"
# Subtitle bold {bool}
sub-bold=no
# Subtitle margin from bottom {int}
sub-margin-y=50
# =============================================================================
# OSD FONT OVERRIDES
# =============================================================================
# OSD colour {colourpicker}
osd-color="#ffdb00"
# OSD border colour {colourpicker}
osd-border-color="#000000"
# =============================================================================
# APP BEHAVIOURS & WINDOW SETTINGS
# =============================================================================
# Auto load other media in folder and treat folder as a playlist {bool}
autoload-files=yes
# Save position on quit {bool}
save-position-on-quit=yes
# Save watch history {bool}
save-watch-history=yes
# Screenshot directory {browse}
screenshot-dir=~~desktop/
profile-restore=copy
reset-on-next-file=video-zoom,video-pan-y,pause
screenshot-template=mpv screenshot %p %f
title=${filename}
title-bar=no
write-filename-in-watch-later-config=yes
# Window behaviour
border=yes
force-window=yes
snap-window=yes
idle=no
keep-open=no
# =============================================================================
# ON SCREEN CONTROLS
# =============================================================================
osc=no
# OSC duration (ms) {int(500-10000)}
osd-duration=2000
# =============================================================================
# AUDIO SETTINGS
# =============================================================================
# Send audio directly to sound system {onoff 3}
#ao=wasapi  # set audio output to Windows Audio Session API (WASAPI)
#audio-spdif=ac3,dts,dts-hd,eac3,truehd # Passthrough audio formats, will be processed by sound system, not Windows
#audio-exclusive=yes # Enable exclusive mode for audio output, which can reduce latency and improve audio quality, but will prevent other applications from playing audio at the same time.
# Audio channel output order {select:7.1,5.1,stereo|5.1,stereo|stereo}
audio-channels=7.1,5.1,stereo
# =============================================================================
# VIDEO RENDER SETTINGS
# =============================================================================
# GPU API to use for rendering {select:Direct3D(d3d11)|Vulkan(vulkan)|OpenGL(opengl)}
gpu-api=d3d11
hwdec=auto
# Safer option -> hwdec-codecs=auto-safe
hwdec-codecs=auto
# =============================================================================
# PERFORMANCE PROFILE
# =============================================================================
# Fideltiy {select:Quality [onoff 3]|Performance [onoff 4-5]}
correct-downscaling=yes
libplacebo-opts=preset=high_quality,upscaler=ewa_lanczos4sharpest,downscaler=lanczos,deband=yes,deband_iterations=2,deband_threshold=6,deband_grain=6,sigmoid=yes
vo=gpu-next
#vo=gpu
#libplacebo-opts=preset=fast,upscaler=bilinear,downscaler=box,deband=no,sigmoid=no,skip_aa=yes,disable_linear=yes,disable_fbos=yes
# =============================================================================
# CUSTOM FILTERS
# =============================================================================
# Upmix audio {select:5.1 Upmix [5]|7.1 Upmix [6-11]}
[5.1-upmix]
profile-desc=Mix non 5.1 audio to 5.1
profile-cond=get("audio-params/channel-count", 0) ~= 6
af=format=channels=5.1
profile-restore=copy
#[7.1-upmix]
#profile-desc=Mix non 7.1 audio to 7.1
#profile-cond=get("audio-params/channel-count", 0) ~= 8
#af=format=channels=7.1
#profile-restore=copy