# Name: VapourSynth
# Description: Frame interpolation for smoother playback. Can be applied automatically with different frame rates for different resolutions, or manually
#enabled=yes
# Enable auto-apply of VapourSynth {bool}
#auto_apply=yes
# FPS to apply when auto-apply is enabled. Comma separate the list to set different fps for different resolutions {(tag)text}
#auto_fps=60,30
# Max resolutions for auto-apply. Comma separate as with auto_fps, each res must have a matching fps {(tag)select:720p(1280)|1080p(1920)|4K(3840)|All(#)}
#auto_max_res=1920,3840
#
# --- Interpolation tuning ---
# Every knob below is passed to the interpolation engine and takes effect the
# next time a file is opened (no mpv restart needed). Delete or leave
# commented to use the defaults baked into vapoursynth.vpy.
#
# -- Rendering hardware --
# GPU rendering: yes = wgpu/DX path (fast); no = CPU rendering (slower).
# {bool}
#hardware_gpu=yes
# GPU device id passed to the renderer when hardware_gpu=yes. {number}
#hardware_gpuid=11
#
# -- Super (motion pyramid) --
# Subpixel precision: 1 = half-pel (faster), 2 = quarter-pel (smoother). {number}
#super_pel=2
# Build the full motion pyramid. {bool}
#super_full=yes
# Scale levels for the pyramid (up/down). {number}
#super_scale_up=2
#super_scale_down=4
# Super "rc" knob from the plugin grammar. {number}
#super_rc=0
# open-svpflow lean mode: the GPU analyse chain builds its own pyramid parts.
# Faster but needs more VRAM; only used when hardware_gpu=yes. {bool}
#super_lean=no
#
# -- Analyse (motion search) --
# Quality preset: fast, balanced, or quality. The explicit keys below
# (vectors, distance, refine_distance, coarse_width) override this preset
# when set. {choice:fast|balanced|quality}
#analyse_quality=balanced
# The number of refine passes over the motion vectors (1 = fast, 3 = best). {number}
#analyse_vectors=3
# Pyramid levels (0 = automatic). {number}
#analyse_levels=0
# Main motion search distance (negative = adaptive, -8 = widest search). {number}
#analyse_distance=-4
# Width cap for the coarse search pass (smaller = faster, 1050 = typical). {number}
#analyse_coarse_width=1050
# SATD cost in the coarse pass (better vectors, slightly slower). {bool}
#analyse_coarse_satd=yes
# Refine pass search distance. {number}
#analyse_refine_distance=2
#
# -- Smooth (render and masking) --
# Interpolation algorithm: 23 = standard high quality, 13 = faster,
# 1/2/11/21/22 also exist in open-svpflow. {number}
#smooth_algo=23
# Block-split rendering mode. {bool}
#smooth_block=no
# Linear blend of scene-change frames instead of a hard cut. {bool}
#smooth_linear=yes
# GPU-only interpolation mode. Ignored (and stripped) when hardware_gpu=no. {bool}
#smooth_cubic=no
# How much of the frame the interpolation mask covers (percent). {number}
#smooth_mask_cover=100
# Mask area knob from the plugin grammar. {number}
#smooth_mask_area=0
# Sharpness of the mask area edge. {number}
#smooth_mask_area_sharp=1.0
# Scene-change detection mode. {number}
#smooth_scene_mode=3
# Blend frames across detected scene changes. {bool}
#smooth_scene_blend=yes
# Scene-change sensitivity limits: m1, m2, scene, zero, blocks.
# Higher = fewer scene detections (more interpolation across cuts).
# {number}
#smooth_limit_m1=1600
#smooth_limit_m2=2800
#smooth_limit_scene=4000
#smooth_limit_zero=200
#smooth_limit_blocks=20
# Luma weighting in the scene-change metric. {number}
#smooth_luma=1.5
#
# -- open-svpflow extras --
# Skip a strictly repeated frame and stretch the motion over both halves.
# 0 = off; try 0.4 for anime with repeated frames. {number}
#feature_dedup=0
# Keep static text/logos crisp during interpolation (broadcast overlays,
# subtitles baked into film). {bool}
#feature_still_mask=no
# Still-mask sensitivity knobs. {number}
#feature_still_limit=4.5
#feature_still_edge=5
#feature_still_tolerance=30
# Learn and lift a static HUD before warping the rest of the frame. {bool}
#feature_peel_mask=no
#feature_peel_limit=6
